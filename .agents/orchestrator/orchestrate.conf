# The repo's facts for the orchestrator, read by ~/.claude/skills/orchestrate/orchestrate.sh as KEY=value
# text and never run; GATE and DOCS_GATE are handed to the agents as the commands they must run.
# A key left commented out takes the default shown. Committed; this machine's values go in orchestrate.local.conf.
# PROJECT=<the repo folder's name>
BASE=main
# OWNER=Thobias
# RULING_DOC=.agents/orchestrator/KNOWLEDGE.md
# What git ignores but each new worktree needs, copied from the main checkout (reflink), such as target, or
# node_modules .env.local prisma/generated:
WORKTREE_COPY=node_modules
# The build, lint and test commands every commit passes:
GATE=`npm run build`, `npm run test:docs-model`, `npm run test:releases`
# DOCS_GATE=
# A Linear team key such as AIRCA, when the issues are Linear's:
# LINEAR_TEAM=
# local, or pr when a branch lands as a squash-merged pull request:
# MERGE=local
# off, or on when each question command commits its own files on BASE:
QUESTION_COMMITS=on
